name: Minimal CI
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: minimal-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 30
  backend-worker:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 30
