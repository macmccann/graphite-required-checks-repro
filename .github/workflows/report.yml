name: Report backend status
on:
  workflow_run:
    workflows: [Minimal CI]
    types: [requested, in_progress, completed]
permissions:
  statuses: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: run.head_sha,
              context: 'backend-checks',
              state: run.status !== 'completed' ? 'pending' :
                run.conclusion === 'success' ? 'success' : 'failure',
              target_url: run.html_url,
              description: 'Minimal backend status reporter',
            });
